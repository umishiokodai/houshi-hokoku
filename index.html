<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="奉仕報告">
<meta name="theme-color" content="#22405E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>奉仕報告</title>
<style>
:root{
  --bg:#F2F4F3;
  --surface:#FFFFFF;
  --ink:#22303C;
  --muted:#68788A;
  --line:#E2E7EA;
  --goal:#3D6BB3;
  --goal-soft:#E4ECF7;
  --ok:#3E8E5A;
  --ok-soft:#E3F0E7;
  --miss:#C0554E;
  --miss-soft:#F7E6E4;
  --navy:#22405E;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;
  padding-bottom:calc(70px + env(safe-area-inset-bottom));
}
button{font-family:inherit;font-size:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
header.app{
  position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
}
header.app h1{font-size:16px;font-weight:600;letter-spacing:.06em}
header.app .who{font-size:12px;opacity:.75}
.wrap{max-width:560px;margin:0 auto;padding:14px 12px 24px}
.banner{
  background:#FFF4D6;border:1px solid #E8D48A;color:#6B5A17;
  border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:12px;
}
/* ---- month navigation ---- */
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.monthnav h2{font-size:19px;font-weight:700}
.monthnav .btns{display:flex;gap:8px}
.monthnav button{
  width:38px;height:38px;border-radius:50%;background:var(--surface);
  border:1px solid var(--line);font-size:17px;color:var(--navy);line-height:1;
}
.monthnav button.today{width:auto;padding:0 12px;font-size:13px;border-radius:19px}
/* ---- summary card ---- */
.card{
  background:var(--surface);border-radius:var(--radius);
  border:1px solid var(--line);padding:14px 16px;margin-bottom:14px;
}
.card h3{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.05em;margin-bottom:8px}
.statrow{display:flex;flex-wrap:wrap;gap:6px 8px;margin-bottom:10px}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  border-radius:16px;padding:3px 11px;font-size:13.5px;font-weight:600;
}
.pill small{font-weight:500;opacity:.8;font-size:11px}
.pill.goal{background:var(--goal);color:#fff}
.pill.plan{background:var(--goal-soft);color:var(--goal)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.miss{background:var(--miss-soft);color:var(--miss)}
.pill.neutral{background:#EEF1F3;color:var(--ink)}
/* pace bar: signature element */
.pace{margin:12px 0 6px}
.pace .track{
  position:relative;height:14px;border-radius:7px;background:#E9EDEF;overflow:visible;
}
.pace .proj{position:absolute;left:0;top:0;height:100%;border-radius:7px;
  background:repeating-linear-gradient(-45deg,var(--goal-soft),var(--goal-soft) 5px,#D3E0F2 5px,#D3E0F2 10px);}
.pace .act{position:absolute;left:0;top:0;height:100%;border-radius:7px;background:var(--goal)}
.pace .mark{position:absolute;top:-4px;width:2px;height:22px;background:var(--ink);border-radius:1px}
.pace .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.pace .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.hint{font-size:12.5px;color:var(--muted)}
.hint b{color:var(--ink)}
.copybtn{
  margin-top:12px;width:100%;padding:10px;border-radius:10px;
  background:var(--navy);color:#fff;font-weight:600;font-size:14px;
}
.copybtn.sub{background:var(--surface);color:var(--navy);border:1px solid var(--line)}
/* ---- calendar ---- */
.cal{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);overflow:hidden}
.cal .dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.cal .dow div{padding:6px 0;text-align:center;font-size:11.5px;color:var(--muted);font-weight:600}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cell{
  min-height:66px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:4px 3px;font-size:12px;position:relative;background:var(--surface);
}
.cell:nth-child(7n){border-right:none}
.cell.out{background:#F6F8F8;color:#B7C0C8}
.cell .d{font-size:12px;font-weight:600;margin-bottom:3px;padding-left:3px}
.cell.today .d{display:inline-block;background:var(--navy);color:#fff;border-radius:9px;padding:0 6px;margin-left:-1px}
.tag{
  display:block;border-radius:6px;font-size:11px;font-weight:700;text-align:center;
  padding:1.5px 0;margin:2px 1px;color:#fff;letter-spacing:.02em;
}
.tag.g{background:var(--goal)}
.tag.a-ok{background:var(--ok)}
.tag.a-miss{background:var(--miss)}
.dot{position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:#B9C3CB}
/* ---- year view ---- */
table.yr{width:100%;border-collapse:collapse;font-size:13.5px}
table.yr th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line)}
table.yr th:first-child{text-align:left}
table.yr td{padding:7px 6px;text-align:right;border-bottom:1px solid #EFF2F4;font-variant-numeric:tabular-nums}
table.yr td:first-child{text-align:left;font-weight:600}
table.yr tr.cur td{background:var(--goal-soft)}
table.yr tr.future td{color:var(--muted)}
table.yr td .mini{font-size:11px;color:var(--goal);padding:2px 8px;border:1px solid var(--goal);border-radius:10px}
/* ---- settings ---- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:5px}
.field input,.field select{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;
}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap}
.rowbtns .copybtn{width:auto;flex:1;margin-top:0}
.danger{color:var(--miss);border-color:var(--miss-soft)!important}
/* ---- bottom nav ---- */
nav.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
  display:flex;justify-content:space-around;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
}
nav.bottom button{
  flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:11px;color:var(--muted);padding:5px 0;border-radius:12px;
}
nav.bottom button.on{color:var(--navy);font-weight:700;background:var(--goal-soft)}
nav.bottom .ic{font-size:19px;line-height:1}
/* ---- modal ---- */
.overlay{
  position:fixed;inset:0;background:rgba(20,30,40,.45);z-index:40;
  display:none;align-items:flex-end;justify-content:center;
}
.overlay.show{display:flex}
.sheet{
  background:var(--surface);width:100%;max-width:560px;
  border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;
}
.sheet h3{font-size:17px;margin-bottom:14px}
.seg{font-size:12.5px;font-weight:700;color:var(--muted);margin:14px 0 6px;letter-spacing:.05em}
.seg:first-of-type{margin-top:0}
.timerow{display:flex;align-items:center;gap:8px}
.timerow input{width:74px;padding:9px;border:1px solid var(--line);border-radius:10px;text-align:center;font-size:18px;font-weight:600}
.timerow span{font-size:13px;color:var(--muted)}
.step{display:flex;align-items:center;gap:14px}
.step button{
  width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;font-size:20px;line-height:1;
}
.step b{font-size:18px;min-width:24px;text-align:center}
.sheet textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;resize:vertical;min-height:44px;
}
.sheetbtns{display:flex;gap:10px;margin-top:18px}
.sheetbtns button{flex:1;padding:12px;border-radius:11px;font-weight:700;font-size:15px}
.sheetbtns .save{background:var(--navy);color:#fff}
.sheetbtns .cancel{background:#EEF1F3}
.sheetbtns .del{background:var(--miss-soft);color:var(--miss);flex:0 0 auto;padding:12px 16px}
.quickclear{font-size:12px;color:var(--muted);text-decoration:underline;margin-left:auto}
/* toast */
#toast{
  position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:9px 18px;border-radius:20px;font-size:13.5px;
  opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="app">
  <h1>奉仕報告</h1>
  <div class="who" id="hdrWho"></div>
</header>

<div class="wrap" id="app"></div>

<nav class="bottom">
  <button id="nav-cal" onclick="go('cal')"><span class="ic">📅</span>記録</button>
  <button id="nav-year" onclick="go('year')"><span class="ic">📈</span>年度</button>
  <button id="nav-set" onclick="go('set')"><span class="ic">⚙️</span>設定</button>
</nav>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<div id="toast"></div>

<script>
'use strict';
/* ================= storage ================= */
var LS_KEY='houshi_hokoku_v1';
var persist=true;
function loadState(){
  try{
    var t='__t'+Date.now();
    localStorage.setItem(t,'1');localStorage.removeItem(t);
    var raw=localStorage.getItem(LS_KEY);
    return raw?JSON.parse(raw):null;
  }catch(e){persist=false;return null;}
}
function save(){
  if(!persist)return;
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
}
var S=loadState()||{
  settings:{name:'',role:'正規開拓者',monthlyGoal:50,yearlyGoal:600,startMonth:9},
  entries:{}
};
if(!S.settings)S.settings={name:'',role:'正規開拓者',monthlyGoal:50,yearlyGoal:600,startMonth:9};
if(!S.entries)S.entries={};
if(!S.monthly)S.monthly={};

/* ================= date helpers ================= */
function pad(n){return (n<10?'0':'')+n;}
function keyOf(y,m,d){return y+'-'+pad(m)+'-'+pad(d);}
var _now=new Date();
var TODAY={y:_now.getFullYear(),m:_now.getMonth()+1,d:_now.getDate()};
var TODAY_KEY=keyOf(TODAY.y,TODAY.m,TODAY.d);
function dim(y,m){return new Date(y,m,0).getDate();}
function fmtMin(min){
  if(min==null)return'–';
  var h=Math.floor(min/60),m=min%60;
  if(m===0)return h+'h';
  if(h===0)return m+"'";
  return h+'h '+pad(m)+"'";
}
function fmtJa(min){
  var h=Math.floor(min/60),m=min%60;
  return m===0? h+'時間' : h+'時間'+m+'分';
}
function svcYearStart(y,m){var s=S.settings.startMonth;return m>=s? y : y-1;}
function monthsOfYear(sy){
  var list=[],s=S.settings.startMonth;
  for(var i=0;i<12;i++){
    var m=((s-1+i)%12)+1;
    var y=sy+(s-1+i>=12?1:0);
    list.push({y:y,m:m});
  }
  return list;
}
function cmpYM(a,b){return (a.y*12+a.m)-(b.y*12+b.m);}

/* ================= calculations ================= */
function monthStats(y,m){
  var goal=0,act=0,studies=0,proj=0,n=dim(y,m);
  for(var d=1;d<=n;d++){
    var k=keyOf(y,m,d),e=S.entries[k];
    if(!e)continue;
    if(e.g)goal+=e.g;
    if(e.a!=null){act+=e.a;proj+=e.a;}
    else if(e.g&&k>=TODAY_KEY)proj+=e.g;
    if(e.s)studies=Math.max(studies,e.s);
  }
  var direct=0,me=S.monthly[y+'-'+pad(m)];
  if(me){
    if(me.a){direct=me.a;act+=me.a;proj+=me.a;}
    if(me.s)studies=Math.max(studies,me.s);
  }
  return{goal:goal,act:act,studies:studies,proj:proj,days:n,direct:direct};
}
function yearStats(sy){
  var ms=monthsOfYear(sy),rows=[],actT=0,projT=0;
  var elapsed=0; // completed months
  for(var i=0;i<ms.length;i++){
    var st=monthStats(ms[i].y,ms[i].m);
    var c=cmpYM(ms[i],TODAY);
    rows.push({y:ms[i].y,m:ms[i].m,st:st,rel:c<0?'past':(c===0?'cur':'future')});
    actT+=st.act;projT+=st.proj;
    if(c<0)elapsed++;
  }
  return{rows:rows,actT:actT,projT:projT,elapsed:elapsed};
}

/* ================= views ================= */
var view='cal';
var cur={y:TODAY.y,m:TODAY.m};
var yearShown=svcYearStart(TODAY.y,TODAY.m);

function go(v){view=v;render();}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function render(){
  document.getElementById('hdrWho').textContent=
    (S.settings.name?S.settings.name+'・':'')+S.settings.role;
  ['cal','year','set'].forEach(function(v){
    document.getElementById('nav-'+v).classList.toggle('on',view===v);
  });
  var app=document.getElementById('app');
  var html='';
  if(!persist)html+='<div class="banner">⚠️ この環境では保存できません(プレビュー表示)。ファイルをダウンロードしてブラウザで開くと、端末に自動保存されます。</div>';
  if(view==='cal')html+=renderCal();
  else if(view==='year')html+=renderYear();
  else html+=renderSet();
  app.innerHTML=html;
}

/* ---- calendar view ---- */
function renderCal(){
  var y=cur.y,m=cur.m,st=monthStats(y,m);
  var gMin=S.settings.monthlyGoal*60;
  var isCur=(y===TODAY.y&&m===TODAY.m);
  var remain=Math.max(0,gMin-st.act);
  var remDays=isCur?(st.days-TODAY.d+1):null;
  var perDay=(remDays&&remDays>0)?Math.ceil(remain/remDays):null;
  var diff=st.proj-gMin;

  var h='';
  h+='<div class="monthnav"><h2>'+y+'年'+m+'月</h2><div class="btns">'
    +'<button onclick="moveMonth(-1)" aria-label="前月">‹</button>'
    +'<button class="today" onclick="cur={y:TODAY.y,m:TODAY.m};render()">今月</button>'
    +'<button onclick="moveMonth(1)" aria-label="翌月">›</button></div></div>';

  // summary card
  h+='<div class="card">';
  h+='<h3>'+esc(S.settings.role)+' ─ 月間目標 '+S.settings.monthlyGoal+'h</h3>';
  h+='<div class="statrow">'
    +'<span class="pill goal">実績 '+fmtMin(st.act)+'</span>'
    +'<span class="pill plan">予定合計 '+fmtMin(st.goal)+'</span>'
    +(st.studies?'<span class="pill neutral">📖 研究 '+st.studies+'</span>':'')
    +'</div>';

  // pace bar (act solid / proj hatched / goal marker)
  var maxV=Math.max(gMin,st.proj,st.act,1);
  var pAct=Math.min(100,st.act/maxV*100);
  var pProj=Math.min(100,st.proj/maxV*100);
  var pGoal=Math.min(100,gMin/maxV*100);
  h+='<div class="pace"><div class="track">'
    +'<div class="proj" style="width:'+pProj.toFixed(1)+'%"></div>'
    +'<div class="act" style="width:'+pAct.toFixed(1)+'%"></div>'
    +'<div class="mark" style="left:calc('+pGoal.toFixed(1)+'% - 1px)"></div>'
    +'</div><div class="legend">'
    +'<span><i style="background:var(--goal)"></i>実績</span>'
    +'<span><i style="background:repeating-linear-gradient(-45deg,#E4ECF7,#E4ECF7 3px,#D3E0F2 3px,#D3E0F2 6px)"></i>着地予測(予定込み)</span>'
    +'<span><i style="background:var(--ink);width:3px;border-radius:1px"></i>目標 '+S.settings.monthlyGoal+'h</span>'
    +'</div></div>';

  h+='<div class="hint">着地予測 <b>'+fmtMin(st.proj)+'</b> '
    +(diff>=0?'<span class="pill ok" style="font-size:12px;padding:1px 8px">+'+fmtMin(diff)+'</span>'
             :'<span class="pill miss" style="font-size:12px;padding:1px 8px">−'+fmtMin(-diff)+'</span>')
    +'</div>';
  if(isCur){
    h+='<div class="hint" style="margin-top:5px">残り <b>'+fmtMin(remain)+'</b>(あと'+remDays+'日'
      +(perDay!=null&&remain>0?' ・ 1日あたり <b>'+fmtMin(perDay)+'</b>':'')+')</div>';
  }
  if(st.direct){
    h+='<div class="hint" style="margin-top:5px">実績のうち <b>'+fmtMin(st.direct)+'</b> は月合計の直接入力分です。</div>';
  }
  h+='<button class="copybtn sub" style="margin-top:12px" onclick="openMonthly('+y+','+m+')">✏️ 月の合計を直接入力(過去分など)</button>';
  h+='<button class="copybtn" onclick="copyReport('+y+','+m+')">📋 '+m+'月の報告をコピー</button>';
  h+='</div>';

  // calendar grid (Monday start)
  var first=new Date(y,m-1,1);
  var lead=(first.getDay()+6)%7; // Mon=0
  var total=lead+st.days;
  var rowsN=Math.ceil(total/7);
  h+='<div class="cal"><div class="dow"><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div><div>日</div></div><div class="grid">';
  for(var i=0;i<rowsN*7;i++){
    var d=i-lead+1;
    if(d<1||d>st.days){h+='<div class="cell out"></div>';continue;}
    var k=keyOf(y,m,d),e=S.entries[k];
    var cls='cell'+(k===TODAY_KEY?' today':'');
    h+='<div class="'+cls+'" onclick="openDay(\''+k+'\')" role="button" tabindex="0" onkeydown="if(event.key===\'Enter\')openDay(\''+k+'\')">';
    h+='<div class="d">'+d+'</div>';
    if(e){
      if(e.g)h+='<span class="tag g">'+fmtMin(e.g)+'</span>';
      if(e.a!=null){
        var okc=(!e.g||e.a>=e.g)?'a-ok':'a-miss';
        h+='<span class="tag '+okc+'">'+fmtMin(e.a)+'</span>';
      }
      if(e.n||e.s)h+='<span class="dot"></span>';
    }
    h+='</div>';
  }
  h+='</div></div>';
  h+='<p class="hint" style="margin-top:10px">日付をタップして目標(青)と実績を入力。実績は目標達成で<span style="color:var(--ok);font-weight:700">緑</span>、未達で<span style="color:var(--miss);font-weight:700">赤</span>で表示されます。</p>';
  return h;
}
function moveMonth(dir){
  var m=cur.m+dir,y=cur.y;
  if(m<1){m=12;y--;}if(m>12){m=1;y++;}
  cur={y:y,m:m};render();
}

/* ---- year view ---- */
function renderYear(){
  var sy=yearShown,ys=yearStats(sy);
  var gMin=S.settings.yearlyGoal*60;
  var elapsedGoal=ys.elapsed*S.settings.monthlyGoal*60;
  var pace=ys.actT-elapsedGoal;
  var projDiff=ys.projT-gMin;

  var h='';
  h+='<div class="monthnav"><h2>'+sy+'年度('+sy+'/'+S.settings.startMonth+'〜)</h2><div class="btns">'
    +'<button onclick="yearShown--;render()" aria-label="前年度">‹</button>'
    +'<button class="today" onclick="yearShown=svcYearStart(TODAY.y,TODAY.m);render()">今年度</button>'
    +'<button onclick="yearShown++;render()" aria-label="翌年度">›</button></div></div>';

  h+='<div class="card"><h3>年間目標 '+S.settings.yearlyGoal+'h</h3>';
  h+='<div class="statrow">'
    +'<span class="pill goal">累計実績 '+fmtMin(ys.actT)+'</span>'
    +(pace>=0?'<span class="pill ok">ペース +'+fmtMin(pace)+'</span>'
             :'<span class="pill miss">ペース −'+fmtMin(-pace)+'</span>')
    +'</div>';
  var maxV=Math.max(gMin,ys.projT,ys.actT,1);
  h+='<div class="pace"><div class="track">'
    +'<div class="proj" style="width:'+Math.min(100,ys.projT/maxV*100).toFixed(1)+'%"></div>'
    +'<div class="act" style="width:'+Math.min(100,ys.actT/maxV*100).toFixed(1)+'%"></div>'
    +'<div class="mark" style="left:calc('+Math.min(100,gMin/maxV*100).toFixed(1)+'% - 1px)"></div>'
    +'</div><div class="legend">'
    +'<span><i style="background:var(--goal)"></i>累計実績</span>'
    +'<span><i style="background:repeating-linear-gradient(-45deg,#E4ECF7,#E4ECF7 3px,#D3E0F2 3px,#D3E0F2 6px)"></i>着地予測(予定込み)</span>'
    +'<span><i style="background:var(--ink);width:3px"></i>'+S.settings.yearlyGoal+'h</span>'
    +'</div></div>';
  h+='<div class="hint">年度末の着地予測 <b>'+fmtMin(ys.projT)+'</b> '
    +(projDiff>=0?'<span class="pill ok" style="font-size:12px;padding:1px 8px">+'+fmtMin(projDiff)+' 達成見込み</span>'
                 :'<span class="pill miss" style="font-size:12px;padding:1px 8px">−'+fmtMin(-projDiff)+' 不足見込み</span>')
    +'</div>';
  h+='<div class="hint" style="margin-top:4px">ペース差は「経過した月数 × '+S.settings.monthlyGoal+'h」との比較です。</div>';
  h+='</div>';

  h+='<div class="card" style="padding:8px 10px"><table class="yr">'
    +'<tr><th>月</th><th>実績</th><th>予定</th><th>研究</th><th></th></tr>';
  for(var i=0;i<ys.rows.length;i++){
    var r=ys.rows[i],cls=r.rel==='cur'?'cur':(r.rel==='future'?'future':'');
    var has=r.st.act>0||r.st.goal>0||r.st.studies>0;
    h+='<tr class="'+cls+'">'
      +'<td><a href="#" style="color:inherit;text-decoration:none" onclick="cur={y:'+r.y+',m:'+r.m+'};go(\'cal\');return false">'+r.y+'/'+r.m+'</a></td>'
      +'<td>'+(r.st.act?fmtMin(r.st.act):'–')+'</td>'
      +'<td>'+(r.st.goal?fmtMin(r.st.goal):'–')+'</td>'
      +'<td>'+(r.st.studies||'–')+'</td>'
      +'<td>'+(has?'<button class="mini" onclick="copyReport('+r.y+','+r.m+')">コピー</button>':'')+'</td>'
      +'</tr>';
  }
  h+='<tr><td>合計</td><td><b>'+fmtMin(ys.actT)+'</b></td><td colspan="3"></td></tr>';
  h+='</table></div>';
  return h;
}

/* ---- settings view ---- */
function renderSet(){
  var s=S.settings,h='';
  h+='<div class="card"><h3>プロフィール</h3>';
  h+='<div class="field"><label>氏名(報告テキストに使われます)</label>'
    +'<input id="setName" value="'+esc(s.name)+'" placeholder="例:山田 花子"></div>';
  h+='<div class="field"><label>区分</label>'
    +'<input id="setRole" value="'+esc(s.role)+'" placeholder="例:正規開拓者"></div>';
  h+='</div>';
  h+='<div class="card"><h3>目標</h3>';
  h+='<div class="field"><label>月間目標(時間)</label>'
    +'<input id="setMG" type="number" min="1" max="500" value="'+s.monthlyGoal+'"></div>';
  h+='<div class="field"><label>年間目標(時間)</label>'
    +'<input id="setYG" type="number" min="1" max="6000" value="'+s.yearlyGoal+'"></div>';
  h+='<div class="field"><label>年度の開始月</label><select id="setSM">';
  for(var m=1;m<=12;m++)h+='<option value="'+m+'"'+(m===s.startMonth?' selected':'')+'>'+m+'月</option>';
  h+='</select></div>';
  h+='<button class="copybtn" onclick="saveSettings()">設定を保存</button>';
  h+='</div>';
  h+='<div class="card"><h3>データ</h3>';
  h+='<div class="rowbtns">'
    +'<button class="copybtn sub" onclick="exportData()">📤 バックアップを書き出す</button>'
    +'<button class="copybtn sub" onclick="document.getElementById(\'impFile\').click()">📥 読み込む</button>'
    +'</div>'
    +'<input type="file" id="impFile" accept=".json,application/json" style="display:none" onchange="importData(this)">'
    +'<button class="copybtn sub danger" style="margin-top:10px" onclick="wipeData()">すべてのデータを削除</button>';
  h+='<p class="hint" style="margin-top:10px">データはこの端末のブラウザ内にのみ保存されます。機種変更の前にバックアップを書き出してください。このHTMLファイルをそのまま送れば、他の人も自分専用として使えます(データは共有されません)。</p>';
  h+='</div>';
  return h;
}
function saveSettings(){
  var s=S.settings;
  s.name=document.getElementById('setName').value.trim();
  s.role=document.getElementById('setRole').value.trim()||'正規開拓者';
  s.monthlyGoal=Math.max(1,parseInt(document.getElementById('setMG').value,10)||50);
  s.yearlyGoal=Math.max(1,parseInt(document.getElementById('setYG').value,10)||600);
  s.startMonth=parseInt(document.getElementById('setSM').value,10)||9;
  yearShown=svcYearStart(TODAY.y,TODAY.m);
  save();render();toast('設定を保存しました');
}
function exportData(){
  var blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='houshi-hokoku-backup-'+TODAY.y+pad(TODAY.m)+pad(TODAY.d)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  toast('バックアップを書き出しました');
}
function importData(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var obj=JSON.parse(r.result);
      if(!obj||typeof obj!=='object'||!obj.settings||!obj.entries)throw 0;
      S=obj;if(!S.monthly)S.monthly={};save();render();toast('データを読み込みました');
    }catch(e){toast('読み込めませんでした(ファイル形式を確認)');}
  };
  r.readAsText(f);inp.value='';
}
function wipeData(){
  if(!confirm('すべての記録と設定を削除します。よろしいですか?'))return;
  S={settings:{name:'',role:'正規開拓者',monthlyGoal:50,yearlyGoal:600,startMonth:9},entries:{},monthly:{}};
  save();render();toast('削除しました');
}

/* ---- day sheet ---- */
var editKey=null;
function openDay(k){
  editKey=k;
  var e=S.entries[k]||{};
  var p=k.split('-');
  var dt=new Date(+p[0],+p[1]-1,+p[2]);
  var yobi=['日','月','火','水','木','金','土'][dt.getDay()];
  function hm(min){return min==null?['','']:[Math.floor(min/60)||'',min%60||''];}
  var g=hm(e.g),a=hm(e.a);
  var h='<h3>'+(+p[0])+'年'+(+p[1])+'月'+(+p[2])+'日('+yobi+')</h3>';
  h+='<div class="seg" style="color:var(--goal)">目標時間(予定)</div>'
    +'<div class="timerow"><input id="gH" type="number" inputmode="numeric" min="0" max="24" placeholder="0" value="'+g[0]+'"><span>h</span>'
    +'<input id="gM" type="number" inputmode="numeric" min="0" max="59" step="5" placeholder="0" value="'+g[1]+'"><span>min</span>'
    +'<button class="quickclear" onclick="document.getElementById(\'gH\').value=\'\';document.getElementById(\'gM\').value=\'\'">クリア</button></div>';
  h+='<div class="seg" style="color:var(--ok)">実績時間</div>'
    +'<div class="timerow"><input id="aH" type="number" inputmode="numeric" min="0" max="24" placeholder="0" value="'+a[0]+'"><span>h</span>'
    +'<input id="aM" type="number" inputmode="numeric" min="0" max="59" step="5" placeholder="0" value="'+a[1]+'"><span>min</span>'
    +'<button class="quickclear" onclick="document.getElementById(\'aH\').value=\'\';document.getElementById(\'aM\').value=\'\'">クリア</button></div>';
  h+='<div class="seg">聖書研究(その月に司会した人数)</div>'
    +'<div class="step"><button onclick="stepS(-1)" aria-label="減らす">−</button><b id="sVal">'+(e.s||0)+'</b><button onclick="stepS(1)" aria-label="増やす">＋</button></div>';
  h+='<div class="seg">メモ</div><textarea id="nVal" placeholder="例:Christina">'+esc(e.n||'')+'</textarea>';
  h+='<div class="sheetbtns">'
    +(S.entries[k]?'<button class="del" onclick="delDay()">削除</button>':'')
    +'<button class="cancel" onclick="closeSheet()">閉じる</button>'
    +'<button class="save" onclick="saveDay()">保存</button></div>';
  document.getElementById('sheet').innerHTML=h;
  document.getElementById('overlay').classList.add('show');
}
function stepS(d){
  var el=document.getElementById('sVal');
  el.textContent=Math.max(0,(parseInt(el.textContent,10)||0)+d);
}
function readMin(hId,mId){
  var h=document.getElementById(hId).value,m=document.getElementById(mId).value;
  if(h===''&&m==='')return null;
  var v=(parseInt(h,10)||0)*60+(parseInt(m,10)||0);
  return v<0?0:v;
}
function saveDay(){
  var g=readMin('gH','gM'),a=readMin('aH','aM');
  var s=parseInt(document.getElementById('sVal').textContent,10)||0;
  var n=document.getElementById('nVal').value.trim();
  if(g==null&&a==null&&!s&&!n){delete S.entries[editKey];}
  else{
    var e={};
    if(g!=null)e.g=g;
    if(a!=null)e.a=a;
    if(s)e.s=s;
    if(n)e.n=n;
    S.entries[editKey]=e;
  }
  save();closeSheet();render();
}
function delDay(){
  delete S.entries[editKey];
  save();closeSheet();render();
}
function closeSheet(){document.getElementById('overlay').classList.remove('show');}

/* ---- monthly bulk input ---- */
var editYM=null;
function openMonthly(y,m){
  editYM=y+'-'+pad(m);
  var me=S.monthly[editYM]||{};
  var hh=me.a?Math.floor(me.a/60):'';
  var mm=me.a?(me.a%60||''):'';
  var h='<h3>'+y+'年'+m+'月 ─ 合計を直接入力</h3>';
  h+='<p class="hint" style="margin-bottom:12px">アプリを使い始める前の月など、日ごとの記録がない月の合計をここに入れると、年度の累計・ペース・着地予測に反映されます。日ごとの入力がある月では両方が合算されるのでご注意ください。</p>';
  h+='<div class="seg" style="color:var(--ok)">その月の合計時間</div>'
    +'<div class="timerow"><input id="bH" type="number" inputmode="numeric" min="0" max="744" placeholder="0" value="'+hh+'"><span>h</span>'
    +'<input id="bM" type="number" inputmode="numeric" min="0" max="59" step="5" placeholder="0" value="'+mm+'"><span>min</span></div>';
  h+='<div class="seg">聖書研究</div>'
    +'<div class="step"><button onclick="stepS(-1)" aria-label="減らす">−</button><b id="sVal">'+(me.s||0)+'</b><button onclick="stepS(1)" aria-label="増やす">＋</button></div>';
  h+='<div class="sheetbtns">'
    +(S.monthly[editYM]?'<button class="del" onclick="delMonthly()">削除</button>':'')
    +'<button class="cancel" onclick="closeSheet()">閉じる</button>'
    +'<button class="save" onclick="saveMonthly()">保存</button></div>';
  document.getElementById('sheet').innerHTML=h;
  document.getElementById('overlay').classList.add('show');
}
function saveMonthly(){
  var a=readMin('bH','bM');
  var s=parseInt(document.getElementById('sVal').textContent,10)||0;
  if(a==null&&!s){delete S.monthly[editYM];}
  else{
    var me={};
    if(a!=null&&a>0)me.a=a;
    if(s)me.s=s;
    if(!me.a&&!me.s)delete S.monthly[editYM];
    else S.monthly[editYM]=me;
  }
  save();closeSheet();render();toast('月合計を保存しました');
}
function delMonthly(){
  delete S.monthly[editYM];
  save();closeSheet();render();toast('月合計を削除しました');
}

/* ---- report copy ---- */
function reportText(y,m){
  var st=monthStats(y,m);
  var lines=['【奉仕報告】'+y+'年'+m+'月'];
  if(S.settings.name)lines.push('氏名: '+S.settings.name);
  lines.push('区分: '+S.settings.role);
  lines.push('時間: '+fmtJa(st.act));
  lines.push('聖書研究: '+st.studies);
  // collect notes (unique)
  var notes=[];
  for(var d=1;d<=st.days;d++){
    var e=S.entries[keyOf(y,m,d)];
    if(e&&e.n&&notes.indexOf(e.n)<0)notes.push(e.n);
  }
  if(notes.length)lines.push('メモ: '+notes.join('、'));
  return lines.join('\n');
}
function copyReport(y,m){
  var t=reportText(y,m);
  function done(){toast(m+'月の報告をコピーしました');}
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done();}
    catch(e){prompt('コピーできない場合は選択してコピーしてください',t);}
    ta.remove();
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done,fallback);
  }else fallback();
}

/* ---- toast ---- */
var _tt=null;
function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(_tt);_tt=setTimeout(function(){el.classList.remove('show');},2200);
}

render();

/* ---- PWA: offline support ---- */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
